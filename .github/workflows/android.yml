
name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Generate Wrapper and Build
      run: |
        # نصب gradle برای تولید فایل‌های missing
        sudo apt-get install gradle -y
        
        # تولید فایل‌های gradlew در صورت نبودن
        gradle wrapper
        
        # حالا اجرای دستور ساخت
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: HSE-AI-PRO-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
